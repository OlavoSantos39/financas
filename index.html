
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <title>Meu Controle Financeiro</title>
  <link rel="stylesheet" href="stylo.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <header>
      <h1>💰 Meu Financeiro</h1>
      <p>Controle seus ganhos e despesas</p>
    </header>

    <section class="saldo-card">
      <p>Saldo disponível</p>
      <h2 id="saldo">R$ 0,00</h2>
    </section>

    <section class="resumo">
      <div class="card ganhos">
        <p>↑ Ganhos</p>
        <h3 id="totalGanhos">R$ 0,00</h3>
      </div>

      <div class="card gastos">
        <p>↓ Gastos</p>
        <h3 id="totalGastos">R$ 0,00</h3>
      </div>
    </section>

    <section class="painel">
      <h2>Nova movimentação</h2>

      <form id="formMovimentacao">
        <label for="descricao">Descrição</label>
        <input
          type="text"
          id="descricao"
          placeholder="Ex: Salário, alimentação..."
          maxlength="100"
          required
        >

        <label for="valor">Valor (R$)</label>
        <input
          type="number"
          id="valor"
          placeholder="0,00"
          min="0.01"
          step="0.01"
          required
        >

        <label for="tipo">Tipo</label>
        <select id="tipo">
          <option value="ganho">Ganho / Saldo</option>
          <option value="gasto">Gasto / Despesa</option>
        </select>

        <button type="submit">
          + Adicionar movimentação
        </button>
      </form>
    </section>

    <section class="painel">
      <h2>Histórico</h2>
      <ul id="listaMovimentacoes"></ul>
      <p id="mensagemVazia">
        Nenhuma movimentação registrada.
      </p>
    </section>

    <footer>
      <p>Meu Financeiro • &copy OlavoTec</p>
    </footer>
  </main>
</body>
</html>
